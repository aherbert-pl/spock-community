# Keeps index.json — the shelf SPOCK reads — in step with the worlds here, and their stars fresh.
name: index
on:
  push:
    branches: [main]
    paths: ["worlds/**"]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: index
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/build_index.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit the index if it changed
        run: |
          if ! git diff --quiet index.json 2>/dev/null || [ -n "$(git status --porcelain index.json)" ]; then
            git config user.name "spock-shelf"; git config user.email "actions@users.noreply.github.com"
            git add index.json && git commit -m "Index: worlds and stars" && git push
          fi
